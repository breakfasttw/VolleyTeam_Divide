<!doctype html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f4f7fb" />
        <meta
            name="description"
            content="依名單產生公平、可重現的分隊與上場順序，並下載為圖片"
        />
        <title>排球分隊器</title>
        <!-- 瀏覽器分頁圖示 (Favicon) -->
        <link
            rel="icon"
            type="image/png"
            href="img/favicon.png?=v202605091600"
        />

        <!-- Apple 手機網頁加入主畫面圖示 -->
        <link rel="apple-touch-icon" href="img/favicon.png?=v202605091600" />

        <!-- (選用) 針對不同尺寸的 Apple 圖示設定 -->
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="img/favicon.png?=v202605091600"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="img/favicon.png?=v202605091600"
        />

        <link
            rel="icon"
            sizes="192x192"
            href="img/favicon.png?=v202605091600"
        />
        <link rel="stylesheet" href="style.css?v=202609260310" />
    </head>
    <body>
        <div id="app" class="app-shell">
            <header id="app-header" class="app-header">
                <a
                    class="brand"
                    href="#"
                    id="brand-home"
                    aria-label="回到設定區"
                >
                    <img src="img/brand.png" alt="回到設定區" />
                </a>
                <nav class="tab-list" aria-label="主要頁籤">
                    <button
                        id="setup-tab"
                        class="tab-button is-active"
                        type="button"
                        aria-selected="true"
                    >
                        設定區
                    </button>
                    <button
                        id="result-tab"
                        class="tab-button"
                        type="button"
                        aria-selected="false"
                        disabled
                    >
                        分隊結果<span
                            id="result-stale-dot"
                            class="stale-dot"
                            hidden
                            aria-label="結果已過期"
                        ></span>
                    </button>
                </nav>
                <button id="reset-button" class="reset-button" type="button">
                    重置
                </button>
            </header>

            <main id="main-content" class="main-content">
                <section
                    id="setup-view"
                    class="view setup-view"
                    aria-labelledby="setup-tab"
                >
                    <div class="page-width">
                        <section
                            id="settings-section"
                            class="settings-card"
                            aria-labelledby="settings-title"
                        >
                            <h1 id="settings-title" class="sr-only">
                                分隊設定
                            </h1>

                            <div class="setting-row setting-row-primary">
                                <label
                                    class="setting-field duration-field"
                                    for="duration-input"
                                >
                                    <span class="field-label">時數</span>
                                    <span class="stepper">
                                        <button
                                            id="duration-minus"
                                            type="button"
                                            aria-label="減少半小時"
                                        >
                                            −
                                        </button>
                                        <input
                                            id="duration-input"
                                            type="number"
                                            min="1"
                                            max="6"
                                            step="0.5"
                                            value="3.0"
                                            inputmode="decimal"
                                            aria-describedby="duration-help"
                                        />
                                        <button
                                            id="duration-plus"
                                            type="button"
                                            aria-label="增加半小時"
                                        >
                                            ＋
                                        </button>
                                    </span>
                                    <span id="duration-help" class="sr-only"
                                        >一至六小時，每次增減半小時</span
                                    >
                                </label>

                                <label
                                    class="setting-field event-field"
                                    for="event-name-input"
                                >
                                    <span class="field-label">名稱</span>
                                    <input
                                        id="event-name-input"
                                        class="text-input"
                                        type="text"
                                        maxlength="16"
                                        placeholder=" 0718板橋藍鵲"
                                        autocomplete="off"
                                    />
                                </label>
                            </div>

                            <div class="setting-row setting-row-secondary">
                                <div class="setting-side-options">
                                    <fieldset class="group-size-field">
                                        <legend class="field-label">
                                            幾人一組
                                        </legend>
                                        <div
                                            id="group-size-options"
                                            class="segmented-control"
                                            role="radiogroup"
                                            aria-label="幾人一組"
                                        >
                                            <button
                                                type="button"
                                                data-group-size="1"
                                                role="radio"
                                                aria-checked="false"
                                                class="is-selected"
                                            >
                                                1
                                            </button>
                                            <button
                                                type="button"
                                                data-group-size="2"
                                                role="radio"
                                                aria-checked="false"
                                            >
                                                2
                                            </button>
                                            <button
                                                type="button"
                                                data-group-size="3"
                                                role="radio"
                                                aria-checked="false"
                                            >
                                                3
                                            </button>
                                        </div>
                                    </fieldset>

                                    <button
                                        id="help-button"
                                        class="help-button"
                                        type="button"
                                        aria-label="操作說明"
                                    >
                                        <span aria-hidden="true">ℹ️</span>
                                        說明
                                    </button>
                                </div>

                                <div class="toggle-fields">
                                    <label class="toggle-field">
                                        <span>先到先打</span>
                                        <input
                                            id="early-play-input"
                                            type="checkbox"
                                            checked
                                        />
                                        <span
                                            class="toggle"
                                            aria-hidden="true"
                                        ></span>
                                    </label>
                                    <label class="toggle-field">
                                        <span>男生打散</span>
                                        <input
                                            id="spread-men-input"
                                            type="checkbox"
                                            checked
                                        />
                                        <span
                                            class="toggle"
                                            aria-hidden="true"
                                        ></span>
                                    </label>
                                    <label class="toggle-field">
                                        <span>新手打散</span>
                                        <input
                                            id="spread-beginners-input"
                                            type="checkbox"
                                            checked
                                        />
                                        <span
                                            class="toggle"
                                            aria-hidden="true"
                                        ></span>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <section
                            id="input-section"
                            class="input-section"
                            aria-labelledby="roster-heading"
                        >
                            <div class="input-toolbar">
                                <h2
                                    id="roster-heading"
                                    class="participant-summary"
                                    aria-live="polite"
                                >
                                    共 0 人參與，0 女 0 男
                                </h2>
                                <div class="transfer-actions">
                                    <button
                                        id="import-button"
                                        class="text-action"
                                        type="button"
                                        aria-label="匯入既有資訊"
                                    >
                                        <span
                                            class="action-icon"
                                            aria-hidden="true"
                                            >↪</span
                                        >匯入既有資訊
                                    </button>
                                    <button
                                        id="copy-button"
                                        class="text-action"
                                        type="button"
                                        aria-label="複製目前資訊"
                                    >
                                        <span
                                            class="action-icon"
                                            aria-hidden="true"
                                            >❐</span
                                        >複製目前資訊
                                    </button>
                                </div>
                            </div>

                            <div
                                id="roster-container"
                                class="roster-container"
                                aria-live="polite"
                            ></div>

                            <div class="setup-actions">
                                <button
                                    id="add-unit-button"
                                    class="secondary-button"
                                    type="button"
                                >
                                    ＋ 新增小組
                                </button>
                                <button
                                    id="start-button"
                                    class="primary-button"
                                    type="button"
                                >
                                    開始分隊
                                </button>
                                <p></p>
                            </div>
                        </section>
                    </div>
                </section>

                <section
                    id="result-view"
                    class="view result-view"
                    aria-labelledby="result-tab"
                    hidden
                >
                    <div class="result-page">
                        <div
                            id="stale-result-notice"
                            class="stale-result-notice"
                            hidden
                        >
                            名單或設定已變更，目前顯示的是上一次結果。請重新分隊以更新。
                        </div>

                        <!-- 移至右上角的頂部操作列 -->
                        <div class="result-top-bar">
                            <div class="result-export-group">
                                <button
                                    id="export-image-button"
                                    class="primary-button export-button"
                                    type="button"
                                >
                                    存為圖片
                                </button>
                            </div>

                            <div class="result-display-controls">
                                <label class="toggle-field">
                                    <span>標註男</span>
                                    <input
                                        id="show-male-marks-input"
                                        type="checkbox"
                                        checked
                                    />
                                    <span
                                        class="toggle"
                                        aria-hidden="true"
                                    ></span>
                                </label>

                                <label class="toggle-field">
                                    <span>標註新手</span>
                                    <input
                                        id="show-beginner-marks-input"
                                        type="checkbox"
                                        checked
                                    />
                                    <span
                                        class="toggle"
                                        aria-hidden="true"
                                    ></span>
                                </label>
                            </div>
                        </div>

                        <div class="result-meta">
                            <p id="result-summary">共 0 人參與，0 女 0 男</p>
                            <p
                                id="result-event-name"
                                class="result-event-name"
                            ></p>
                        </div>

                        <div id="result-content" class="result-content"></div>
                    </div>
                </section>
            </main>
        </div>

        <div id="modal-root" class="modal-root" hidden>
            <div class="modal-backdrop"></div>
            <section
                id="modal-dialog"
                class="modal-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
                tabindex="-1"
            >
                <button
                    id="modal-close"
                    class="modal-close"
                    type="button"
                    aria-label="關閉視窗"
                >
                    ×
                </button>
                <div
                    id="modal-icon"
                    class="modal-icon"
                    aria-hidden="true"
                ></div>
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-message" class="modal-message"></div>
                <div id="modal-extra" class="modal-extra"></div>
                <div id="modal-actions" class="modal-actions"></div>
            </section>
        </div>

        <div
            id="busy-overlay"
            class="busy-overlay"
            hidden
            aria-live="assertive"
            aria-busy="true"
        >
            <div id="busy-spinner" class="spinner" aria-hidden="true"></div>
            <div id="busy-check" class="busy-check" hidden aria-hidden="true">
                ✓
            </div>
            <p id="busy-text">分隊中</p>
        </div>

        <div
            id="toast"
            class="toast"
            hidden
            role="status"
            aria-live="polite"
        ></div>

        <script src="storage.js" defer></script>
        <script src="scheduler.js" defer></script>
        <script src="interactions.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script src="storage.js" defer></script>
        <script src="scheduler.js" defer></script>
        <script src="interactions.js" defer></script>
        <script src="image-exporter.js" defer></script>
        <script src="main.js?v=202609260310" defer></script>
    </body>
</html>
